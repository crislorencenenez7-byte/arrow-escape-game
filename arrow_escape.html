<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f1e7cf"><title>Arrow Escape</title>
<style>
:root{--paper:#f1e7cf;--ink:#8a7254;--blue:#398bd2}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,Arial,sans-serif}
main{max-width:560px;margin:auto;padding:16px 10px 22px}.top{display:flex;align-items:center;gap:9px;margin:2px 0 14px}.life{font-size:32px;line-height:1;color:var(--blue);filter:drop-shadow(0 1px 0 #fff8)}.spacer{flex:1}.title{font-weight:800;font-size:18px;color:#80684b}.tiny{font-size:12px;color:#927e61}
.frame{background:#f3ead4;padding:0;border:0;box-shadow:none}svg{display:block;width:100%;height:auto;background:#f1e7cf;touch-action:manipulation}
.arrow{fill:none;stroke:#8a7254;stroke-width:3.6;stroke-linecap:square;stroke-linejoin:miter;marker-end:url(#head);cursor:pointer;transition:opacity .18s,stroke .18s}
.arrow:active{stroke:#3d8fcf}.arrow.gone{opacity:0;pointer-events:none}.arrow.blocked{stroke:#a9977b}
.controls{display:flex;gap:8px;margin-top:12px}.btn{border:1px solid #c8b895;border-radius:8px;background:#f8f0df;color:#755e42;font-weight:700;padding:10px 13px;font-size:14px}.message{min-height:22px;text-align:center;margin:9px 0 0;font-size:13px}.bottom{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:6px;color:#927e61}
</style></head>
<body><main>
<div class="top"><span class="life" id="l1">💧</span><span class="life" id="l2">💧</span><span class="life" id="l3">💧</span><span class="spacer"></span><span class="title">ARROW ESCAPE</span></div>
<div class="frame">
<svg id="board" viewBox="0 0 420 520" role="img" aria-label="Arrow maze puzzle">
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="5.4" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#8a7254"/></marker></defs>
<g id="paths"></g></svg>
</div>
<div class="bottom"><span id="left">Arrows left: 0</span><span id="level">Level 1</span><span id="moves">Moves: 0</span></div>
<div class="message" id="message">Tap an arrow whose direction has a clear path out of the maze.</div>
<div class="controls"><button class="btn" id="restart">↻ Restart</button><button class="btn" id="hint">Hint</button><button class="btn" id="new">New maze</button></div>
</main>
<script>
(()=>{
const svg=document.getElementById('board'), group=document.getElementById('paths');
const NS='http://www.w3.org/2000/svg';
let paths=[],lives=3,moves=0,level=1,history=[];
/* Orthogonal, hand-shaped arrow paths: each ends in a real SVG arrowhead. */
const layout=[
[[10,32],[48,32],[48,10],[82,10]],[[18,56],[18,38],[64,38],[64,70],[112,70],[112,18],[146,18],[146,44],[130,44],[130,34],[140,34]],
[[160,12],[160,42],[212,42],[212,22],[250,22],[250,10]],[[270,10],[270,70],[300,70],[300,32],[328,32],[328,58],[350,58],[350,18],[384,18]],
[[10,90],[62,90],[62,110],[38,110],[38,128],[94,128],[94,96],[136,96]],[[112,76],[112,58],[178,58]],[[146,82],[146,100],[198,100],[198,78],[224,78]],[[232,92],[232,118],[270,118],[270,92],[314,92],[314,126],[386,126]],
[[10,150],[28,150],[28,176],[14,176],[14,190],[48,190]],[[58,148],[58,168],[92,168],[92,144],[124,144],[124,190],[158,190],[158,162],[190,162]],[[200,142],[200,174],[230,174],[230,150],[254,150]],[[266,142],[266,166],[294,166],[294,144],[334,144]],[[346,150],[346,182],[386,182]],
[[10,218],[10,202],[40,202],[40,222],[66,222],[66,202],[94,202],[94,232],[124,232],[124,208],[154,208]],[[166,202],[166,226],[196,226],[196,206],[220,206],[220,236],[252,236]],[[270,204],[270,226],[304,226],[304,202],[336,202],[336,238],[386,238]],
[[10,258],[48,258],[48,282],[22,282]],[[62,250],[62,270],[92,270],[92,250],[120,250],[120,284],[148,284]],[[158,254],[158,278],[190,278],[190,250],[214,250]],[[226,256],[226,286],[252,286],[252,260],[282,260],[282,286],[312,286]],[[324,254],[324,276],[350,276],[350,252],[386,252]],
[[10,316],[10,294],[34,294],[34,326],[58,326]],[[70,306],[70,326],[104,326],[104,302],[134,302],[134,336],[162,336]],[[176,300],[176,326],[204,326],[204,300],[232,300],[232,334],[260,334]],[[274,304],[274,326],[304,326],[304,300],[332,300],[332,338],[386,338]],
[[10,364],[40,364],[40,390],[70,390],[70,364],[98,364],[98,404],[130,404]],[[142,360],[142,388],[170,388],[170,362],[202,362],[202,396],[232,396]],[[244,360],[244,390],[272,390],[272,360],[302,360],[302,400],[336,400],[336,364],[386,364]],
[[10,432],[10,408],[38,408],[38,446],[70,446]],[[82,416],[82,438],[110,438],[110,414],[140,414],[140,454],[170,454]],[[184,412],[184,438],[212,438],[212,414],[242,414],[242,452],[270,452]],[[284,414],[284,438],[310,438],[310,414],[340,414],[340,454],[386,454]],
[[10,488],[48,488],[48,466],[82,466],[82,496],[116,496]],[[130,480],[130,502],[162,502],[162,474],[190,474],[190,500],[218,500]],[[232,480],[232,502],[264,502],[264,478],[296,478],[296,502],[326,502]],[[340,480],[340,502],[386,502]]
];
function direction(p){const a=p[p.length-2],b=p[p.length-1];return Math.abs(a[0]-b[0])>Math.abs(a[1]-b[1])?(b[0]>a[0]?'right':'left'):(b[1]>a[1]?'down':'up')}
function make(){group.innerHTML='';paths=[];lives=3;moves=0;history=[];layout.forEach((coords,i)=>{let el=document.createElementNS(NS,'polyline');el.setAttribute('points',coords.map(p=>p.join(',')).join(' '));el.setAttribute('class','arrow');el.dataset.id=i;el.dataset.dir=direction(coords);el.addEventListener('click',()=>tap(i));group.appendChild(el);paths.push({id:i,coords,el,alive:true,dir:direction(coords)})});update();msg('Tap an arrow whose path to the edge is clear.')}
function blocked(p){let [x,y]=p.coords[p.coords.length-1],dir=p.dir;return paths.some(q=>q.alive&&q.id!==p.id&&q.coords.some(([xx,yy])=>{if(dir==='right')return Math.abs(yy-y)<3&&xx>x+2;if(dir==='left')return Math.abs(yy-y)<3&&xx<x-2;if(dir==='down')return Math.abs(xx-x)<3&&yy>y+2;return Math.abs(xx-x)<3&&yy<y-2}))}
function tap(id){let p=paths.find(q=>q.id===id);if(!p||!p.alive)return;if(blocked(p)){lives--;update();msg('Blocked! One drop of water lost.');if(!lives)msg('Out of lives — tap Restart to try again.');return}history.push(paths.map(q=>q.alive));p.alive=false;p.el.classList.add('gone');moves++;update();if(paths.every(q=>!q.alive)){level++;msg('Puzzle cleared! Tap New maze for another level.')}else msg('Arrow escaped! Keep going.')}
function update(){['l1','l2','l3'].forEach((id,i)=>document.getElementById(id).style.opacity=i<lives?'1':'.18');document.getElementById('left').textContent='Arrows left: '+paths.filter(p=>p.alive).length;document.getElementById('moves').textContent='Moves: '+moves;document.getElementById('level').textContent='Level '+level}
function msg(s){document.getElementById('message').textContent=s}
document.getElementById('restart').onclick=()=>make();
document.getElementById('new').onclick=()=>{level++;make();document.getElementById('level').textContent='Level '+level};
document.getElementById('hint').onclick=()=>{let p=paths.find(q=>q.alive&&!blocked(q));if(p){p.el.style.stroke='#398bd2';msg('Hint: try the blue arrow.');setTimeout(()=>{p.el.style.stroke=''},1300)}else msg('No clear arrow found — restart the puzzle.')};
make();
})();
</script></body></html>
